name: Build Windows

# Compilation automatique : à chaque dépôt (push) sur main/master,
# GitHub construit l'installeur Windows (.exe) tout seul.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # nécessaire uniquement pour publier une « Release » quand on pousse un tag vX.Y.Z

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests (logique de publication Netlify)
        run: npm test

      - name: Construire l'installeur Windows
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # pas de signature de code

      - name: Déposer l'installeur (onglet Actions > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: AminaGalerie-Windows-Setup
          path: dist/AminaGalerie-Setup-*.exe
          if-no-files-found: error

      - name: Publier une Release (si le dépôt reçoit un tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/AminaGalerie-Setup-*.exe \
            --title "AMINA-FDS Galerie ${{ github.ref_name }}" --generate-notes
